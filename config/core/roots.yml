# sg_pipeline: the storage root all project folders are created under.
#
# The path comes from the "primary" Local Storage on the ShotGrid site
# (Site Preferences > File Management): windows_path C:\Studio_Projects.
# Toolkit fills the paths in from the site when it starts, and refuses to
# start if the site has no Local Storage of this name.

primary:
    description: Production data. Each project gets a folder named after its
        tank_name (StudioReady_Demo) below this location.
    mac_path:
    linux_path:
    windows_path:
    default: true
