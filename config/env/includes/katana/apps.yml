# sg_pipeline: apps of the Katana integration, shared by all of its environments.

includes:
- ../common/apps.yml

katana.apps.tk-multi-publish2:
  help_url: "@common.apps.tk-multi-publish2.help_url"
  collector: "{self}/collector.py:{config}/tk-multi-publish2/katana/collector.py"
  publish_plugins:
  # Katana -> Nuke: publish the frames each Render node output wrote
  - name: Publish Render
    hook: "{self}/publish_file.py:{config}/tk-multi-publish2/katana/publish_render.py"
    settings: {}
  location: "@common.apps.tk-multi-publish2.location"

katana.apps.tk-multi-loader2:
  action_mappings:
    # Maya -> Katana
    USD Geometry: [katana_usd_in]
  actions_hook: '{config}/tk-multi-loader2/tk-katana_actions.py'
  entities:
  - caption: Current Project
    type: Hierarchy
    root: "{context.project}"
    publish_filters: []
  - caption: My Tasks
    type: Query
    entity_type: Task
    filters:
    - [project, is, '{context.project}']
    - [task_assignees, is, '{context.user}']
    hierarchy: [entity, content]
  # only show the latest publish of each path (see the note in maya/apps.yml)
  publish_filters: [["sg_status_list", "is_not", null]]
  location: "@common.apps.tk-multi-loader2.location"

# sg_pipeline: Workfiles (File Open / Save) with our Katana scene operations
katana.apps.tk-multi-workfiles2.asset_step:
  template_work: katana_asset_work
  template_work_area: asset_work_area_katana
  template_publish: katana_asset_publish
  template_publish_area: asset_publish_area_katana
  hook_scene_operation: '{config}/tk-multi-workfiles2/scene_operation_tk-katana.py'
  entities: '@common.apps.tk-multi-workfiles2.entities'
  location: '@common.apps.tk-multi-workfiles2.location'
katana.apps.tk-multi-workfiles2.shot_step:
  template_work: katana_shot_work
  template_work_area: shot_work_area_katana
  template_publish: katana_shot_publish
  template_publish_area: shot_publish_area_katana
  hook_scene_operation: '{config}/tk-multi-workfiles2/scene_operation_tk-katana.py'
  entities: '@common.apps.tk-multi-workfiles2.entities'
  location: '@common.apps.tk-multi-workfiles2.location'
