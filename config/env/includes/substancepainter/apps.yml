# sg_pipeline: apps of the Substance 3D Painter integration, shared by all of
# its environments (project, asset_step, shot_step).

includes:
- ../common/apps.yml

substancepainter.apps.tk-multi-publish2:
  help_url: "@common.apps.tk-multi-publish2.help_url"
  collector: "{self}/collector.py:{config}/tk-multi-publish2/substancepainter/collector.py"
  publish_plugins:
  # Painter -> Mari / Maya: export each texture set's maps and publish them
  - name: Publish Textures
    hook: "{self}/publish_file.py:{config}/tk-multi-publish2/substancepainter/publish_textures.py"
    settings: {}
  location: "@common.apps.tk-multi-publish2.location"

substancepainter.apps.tk-multi-loader2:
  action_mappings:
    USD Geometry: [painter_new_project, painter_update_mesh]
  actions_hook: '{config}/tk-multi-loader2/tk-substancepainter_actions.py'
  entities:
  - caption: Current Project
    type: Hierarchy
    root: "{context.project}"
    publish_filters: []
  - caption: My Tasks
    type: Query
    entity_type: Task
    filters:
    - [project, is, '{context.project}']
    - [task_assignees, is, '{context.user}']
    hierarchy: [entity, content]
  # only show the latest publish of each path (see the note in maya/apps.yml)
  publish_filters: [["sg_status_list", "is_not", null]]
  location: "@common.apps.tk-multi-loader2.location"

# sg_pipeline: Workfiles (File Open / Save) with our Painter scene operations
substancepainter.apps.tk-multi-workfiles2.asset_step:
  template_work: substancepainter_asset_work
  template_work_area: asset_work_area_substancepainter
  template_publish: substancepainter_asset_publish
  template_publish_area: asset_publish_area_substancepainter
  hook_scene_operation: '{config}/tk-multi-workfiles2/scene_operation_tk-substancepainter.py'
  entities: '@common.apps.tk-multi-workfiles2.entities'
  location: '@common.apps.tk-multi-workfiles2.location'
