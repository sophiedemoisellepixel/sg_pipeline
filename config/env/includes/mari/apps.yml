# sg_pipeline: apps of the Mari integration, shared by all of its environments.

includes:
- ../common/apps.yml

mari.apps.tk-multi-publish2:
  help_url: "@common.apps.tk-multi-publish2.help_url"
  collector: "{self}/collector.py:{config}/tk-multi-publish2/mari/collector.py"
  publish_plugins:
  # Mari -> Maya: export each channel flattened and publish it
  - name: Publish Channel
    hook: "{self}/publish_file.py:{config}/tk-multi-publish2/mari/publish_channel.py"
    settings: {}
  location: "@common.apps.tk-multi-publish2.location"

mari.apps.tk-multi-loader2:
  action_mappings:
    USD Geometry: [mari_new_project, mari_add_geometry]
    Texture: [mari_import_layer]
  actions_hook: '{config}/tk-multi-loader2/tk-mari_actions.py'
  entities:
  - caption: Current Project
    type: Hierarchy
    root: "{context.project}"
    publish_filters: []
  - caption: My Tasks
    type: Query
    entity_type: Task
    filters:
    - [project, is, '{context.project}']
    - [task_assignees, is, '{context.user}']
    hierarchy: [entity, content]
  # only show the latest publish of each path (see the note in maya/apps.yml)
  publish_filters: [["sg_status_list", "is_not", null]]
  location: "@common.apps.tk-multi-loader2.location"
