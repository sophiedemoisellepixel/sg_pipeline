<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="18" fill="#0f172a"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#f8fafc">How Griptape talks to ShotGrid</text>
  <text x="40" y="80" font-size="15" fill="#94a3b8">Griptape's Python cannot run the Toolkit core, so the nodes call a small bridge that runs with the desktop app's Python and its saved sign-in.</text>

  <g transform="translate(40,120)">
    <rect width="300" height="190" rx="14" fill="#052e16" stroke="#4ade80" stroke-width="2"/>
    <text x="24" y="38" font-size="18" font-weight="700" fill="#dcfce7">Griptape Nodes</text>
    <text x="24" y="62" font-size="13" fill="#86efac">Python 3.12</text>
    <g font-size="13" fill="#f0fdf4">
      <rect x="24" y="80" width="252" height="28" rx="7" fill="#14532d"/><text x="38" y="99">ShotGrid Load Publish</text>
      <rect x="24" y="114" width="252" height="28" rx="7" fill="#14532d"/><text x="38" y="133">ShotGrid Publish Image</text>
      <rect x="24" y="148" width="252" height="28" rx="7" fill="#14532d"/><text x="38" y="167">ShotGrid Publish 3D</text>
    </g>
  </g>

  <g transform="translate(450,120)">
    <rect width="300" height="190" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="24" y="38" font-size="18" font-weight="700" fill="#ede9fe">sg_bridge.py</text>
    <text x="24" y="62" font-size="13" fill="#c4b5fd">desktop app's Python + tk-core</text>
    <g font-size="14" fill="#e2e8f0" font-family="Consolas, Menlo, monospace">
      <text x="24" y="98">find</text>
      <text x="24" y="124">next_version</text>
      <text x="24" y="150">locate</text>
      <text x="24" y="176">publish</text>
    </g>
    <g font-size="13" font-weight="600" text-anchor="end">
      <text x="276" y="98" fill="#86efac">reads</text>
      <text x="276" y="124" fill="#86efac">reads</text>
      <text x="276" y="150" fill="#86efac">reads</text>
      <text x="276" y="176" fill="#fda4af">writes</text>
    </g>
  </g>

  <g transform="translate(860,120)">
    <rect width="300" height="190" rx="14" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <text x="24" y="38" font-size="18" font-weight="700" fill="#e0f2fe">ShotGrid</text>
    <text x="24" y="62" font-size="13" fill="#bae6fd">the desktop app's saved sign-in</text>
    <g font-size="13" fill="#e0f2fe">
      <text x="24" y="98">PublishedFile: name, version, type</text>
      <text x="24" y="124">upstream links (made from…)</text>
      <text x="24" y="150">studio folders from the templates</text>
      <text x="24" y="176">no password ever reaches Griptape</text>
    </g>
  </g>

  <g stroke="#94a3b8" stroke-width="2.5" fill="none">
    <path d="M342 200 H438"/>
    <path d="M448 240 H352"/>
    <path d="M752 215 H848"/>
  </g>
  <g fill="#94a3b8">
    <polygon points="448,200 436,193 436,207"/>
    <polygon points="342,240 354,233 354,247"/>
    <polygon points="858,215 846,208 846,222"/>
  </g>
  <g font-size="12" fill="#cbd5e1" text-anchor="middle">
    <text x="394" y="190">JSON on stdin</text>
    <text x="394" y="258">{"ok": true, ...}</text>
    <text x="804" y="205">Python API</text>
  </g>
</svg>
